<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对照实体棋盘</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #faf7f0; color: #2b2b2b;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 20px 24px 60px;
  }
  h1 { font-size: 23px; margin: 0 0 4px; }
  .sub { color: #6b6b6b; font-size: 14px; margin: 0 0 16px; line-height: 1.7; }
  .sub b { color: #b3261e; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: #8a8378; letter-spacing: .5px; }

  .side { display: flex; gap: 26px; align-items: flex-start; flex-wrap: wrap; }
  .col { }
  .col > .cap { font-size: 13px; color: #6b6b6b; margin-bottom: 6px; font-weight: 700; }
  img.ref { width: 640px; max-width: 92vw; border-radius: 10px; display: block; }

  .board { display: grid; gap: 3px; padding: 6px; border-radius: 10px; }
  .sq { position: relative; display: grid; place-items: center; border-radius: 9px; }
  .sq svg { width: 78%; height: 78%; }
  .sq.water svg { width: 90%; height: 90%; }

  /* 棋子：奶油圆角牌，动物在左、汉字竖排在右 —— 照参考图的排法 */
  .piece {
    position: relative; width: 94%; height: 94%; border-radius: 22%;
    display: block; box-shadow: 0 1px 0 rgba(0,0,0,.18);
  }
  .piece svg { position: absolute; left: 1%; top: 4%; width: 80%; height: 92%; }
  .piece .nm {
    position: absolute; right: 3%; top: 50%; transform: translateY(-50%);
    font-weight: 800; line-height: 1.05; writing-mode: vertical-rl;
    letter-spacing: 0;
  }

  .strip { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .one { text-align: center; }
  .one .box { border-radius: 12px; display: grid; place-items: center; position: relative; }
  .one .lab { font-size: 11px; color: #8a8378; margin-top: 3px; }
  .sizes { display: flex; flex-direction: column; gap: 9px; }
  .row { display: flex; gap: 6px; align-items: flex-end; }
  .row .cap { font-size: 11px; color: #8a8378; width: 34px; flex: none; }
  .cell { display: grid; place-items: center; border-radius: 6px; }
  .cell svg { width: 100%; height: 100%; }
  .sil svg { filter: brightness(0); }
  .gray { filter: grayscale(1); }
</style>
</head>
<body>

<h1>对照实体棋盘</h1>
<p class="sub">
  左边是你给的实体棋盘（<b>本地文件，不入库</b> —— 那是别人商品的美术，公开仓库里不该有）。<br>
  右边是按它的<b>画法系统</b>重建的，形状坐标全部重新定，不是描摹。颜色不照抄照片：
  那张照片室内暖光偏色，采出来发浑，取的是同色系干净饱和值。
</p>

<div class="side">
  <div class="col">
    <div class="cap">参考 · 实体棋盘</div>
    <img class="ref" src="_ref_local.jpg" alt="参考棋盘" onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'参考图不在本地（已被 gitignore，属正常）',style:'color:#999;font-size:13px;padding:40px 0'}))">
  </div>
  <div class="col">
    <div class="cap">重建 · 52px 格（游戏里的常见尺寸）</div>
    <div id="board52"></div>
  </div>
</div>

<h2>八只动物 · 大图看画法</h2>
<div class="strip" id="big"></div>

<h2>真实尺寸压力测试 · 41px 是游戏里的下限</h2>
<div class="sizes" id="sizes"></div>

<h2>剪影 24px 与灰度 41px · 抓「只靠颜色区分」</h2>
<div class="sizes" id="tests"></div>

<script src="sets/board-style.js"></script>
<script>
(function () {
  const set = window.SPRITE_SETS[0];
  const P = set.palette;
  const NAME_CN = { rat:'鼠', cat:'猫', dog:'犬', wolf:'狼', leopard:'豹', tiger:'虎', lion:'狮', elephant:'象' };
  const ANIMALS = ['rat','cat','dog','wolf','leopard','tiger','lion','elephant'];
  const COLS = 7, ROWS = 9, idx = (c, r) => r * COLS + c;
  const isWater = (i) => [1,2,4,5].includes(i % COLS) && [3,4,5].includes(Math.floor(i / COLS));
  const isCroc = (i) => i === idx(1,4) || i === idx(5,4);
  const LILY = [idx(2,3), idx(4,3), idx(2,5), idx(4,5)];
  const TRAPS = [idx(2,0), idx(4,0), idx(3,1), idx(2,8), idx(4,8), idx(3,7)];
  const LAYOUT = [
    [0,0,'lion','foe'],[6,0,'tiger','foe'],[1,1,'dog','foe'],[5,1,'cat','foe'],
    [0,2,'rat','foe'],[2,2,'leopard','foe'],[4,2,'wolf','foe'],[6,2,'elephant','foe'],
    [0,6,'elephant','mine'],[2,6,'wolf','mine'],[4,6,'leopard','mine'],[6,6,'rat','mine'],
    [1,7,'cat','mine'],[5,7,'dog','mine'],[0,8,'tiger','mine'],[6,8,'lion','mine'],
  ];
  const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h !== undefined) n.innerHTML = h; return n; };

  function board(px) {
    const b = el('div', 'board');
    b.style.gridTemplateColumns = `repeat(${COLS}, ${px}px)`;
    b.style.background = P.boardEdge;
    const at = new Map(LAYOUT.map(([c, r, rank, side]) => [idx(c, r), { rank, side }]));
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const i = idx(c, r), sq = el('div', 'sq');
      sq.style.width = sq.style.height = px + 'px';
      const alt = (c + r) % 2;
      let bg, art = '';
      if (isWater(i)) { bg = P.water; sq.classList.add('water');
        if (isCroc(i)) art = set.sprites.croc; else if (LILY.includes(i)) art = set.sprites.lily; }
      else if (i === idx(3,8)) { bg = P.denMineBg; art = set.sprites.denMine; }
      else if (i === idx(3,0)) { bg = P.denFoeBg; art = set.sprites.denFoe; }
      else if (TRAPS.includes(i)) { bg = P.trapBg; art = set.sprites.trap; }
      else if (r <= 2) bg = alt ? P.grassFoeAlt : P.grassFoe;
      else if (r >= 6) bg = alt ? P.grassMineAlt : P.grassMine;
      else bg = alt ? P.earthAlt : P.earth;
      sq.style.background = bg;
      sq.innerHTML = art;
      const p = at.get(i);
      if (p) {
        const card = el('div', 'piece');
        card.style.background = P.card;
        card.innerHTML = set.sprites[p.rank] +
          `<span class="nm" style="font-size:${(px*0.28).toFixed(1)}px;color:${p.side==='mine'?P.borderMine:P.borderFoe}">${NAME_CN[p.rank]}</span>`;
        sq.appendChild(card);
      }
      b.appendChild(sq);
    }
    return b;
  }

  document.getElementById('board52').appendChild(board(52));

  const big = document.getElementById('big');
  for (const a of ANIMALS) {
    const one = el('div', 'one');
    const box = el('div', 'box');
    box.style.cssText = `width:118px;height:118px;background:${P.card}`;
    box.innerHTML = set.sprites[a] +
      `<span style="position:absolute;right:5%;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-weight:800;font-size:26px;color:${P.borderMine}">${NAME_CN[a]}</span>`;
    box.querySelector('svg').style.cssText = 'position:absolute;left:1%;top:4%;width:80%;height:92%';
    box.style.position = 'relative';
    one.appendChild(box);
    one.appendChild(el('div', 'lab', NAME_CN[a]));
    big.appendChild(one);
  }

  function row(px, cls, into) {
    const r = el('div', 'row');
    r.appendChild(el('span', 'cap', px + 'px'));
    for (const a of ANIMALS) {
      const c = el('div', 'cell ' + (cls || ''), set.sprites[a]);
      c.style.width = c.style.height = px + 'px';
      c.style.background = P.card;
      c.title = NAME_CN[a];
      r.appendChild(c);
    }
    into.appendChild(r);
  }
  [70, 52, 41, 32].forEach((px) => row(px, '', document.getElementById('sizes')));
  row(24, 'sil', document.getElementById('tests'));
  row(41, 'gray', document.getElementById('tests'));
})();
</script>
</body>
</html>
