<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棋盘预览 · 风格 A</title>
<style>
  /* ---------------------------------------------------------------
     版式参数。全部由格高派生 —— 两个维度各自 clamp 会在某些窗口下
     改变格子比例，棋区就不再是参考图的 1.028。
     核心几何：70x52 格 + 4px 缝 + 20px 外框。
     整板 514x500 = 1.0280，参考图实测 1.028，四位小数吻合。
     --------------------------------------------------------------- */
  :root {
    --cell-h: clamp(36px, min(8.6dvh, 9.38vw), 52px);
    --cell-w: calc(var(--cell-h) * 70 / 52);
    --cell-gap: calc(var(--cell-h) * 4 / 52);
    --cell-radius: calc(var(--cell-h) * 8 / 52);
    --board-frame: calc(var(--cell-h) * 20 / 52);

    --piece-w: calc(var(--cell-w) * 60 / 70);
    --piece-h: calc(var(--cell-h) * 44 / 52);
    --piece-radius: calc(var(--cell-h) * 7 / 52);
    --label-size: calc(var(--cell-h) * 0.18);
    --river-text: calc(var(--cell-h) * 0.25);

    /* 配色沿用，这一批不动颜色 */
    --grass-mine: #b9d641; --grass-foe: #e8436b;
    --earth: #f0913f;      --water: #6fc6e8;
    --trap-bg: #f2b32c;    --den-bg: #12869c;
    --edge: #0e7a8f;       --card: #f7eeb4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #faf7f0; color: #2b2b2b;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 18px 22px 60px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #6b6b6b; font-size: 13px; margin: 0 0 16px; line-height: 1.7; }
  .sub b { color: #b3261e; }
  .side { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .cap { font-size: 13px; color: #6b6b6b; margin-bottom: 6px; font-weight: 700; }
  img.ref { width: 500px; max-width: 90vw; border-radius: 10px; display: block; }

  .frame {
    display: inline-block; background: var(--edge);
    padding: var(--board-frame); border-radius: calc(var(--board-frame) * 0.9);
  }
  .board {
    position: relative; display: grid;
    grid-template-columns: repeat(7, var(--cell-w));
    grid-template-rows: repeat(9, var(--cell-h));
    gap: var(--cell-gap);
  }
  .sq {
    position: relative; border-radius: var(--cell-radius);
    display: grid; place-items: center; overflow: visible;
  }
  /* 地形修饰铺在格面上，很淡，不和棋子抢 */
  .sq > .deco {
    position: absolute; inset: 0; border-radius: inherit;
    background-size: cover; background-position: center; pointer-events: none;
  }
  /* 地形图标（兽穴/陷阱/荷叶/鳄鱼） */
  .sq > .terr {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background-repeat: no-repeat; background-position: center;
    background-size: contain; pointer-events: none;
  }

  /* 连成一片的河，压在格子下面 */
  .pool {
    position: absolute; border-radius: calc(var(--cell-radius) * 1.6);
    background: var(--water); z-index: 0; overflow: hidden;
  }
  .pool .wav {
    position: absolute; inset: 0;
    background-repeat: repeat; background-size: 50% auto; opacity: .5;
  }
  .pool .riv {
    position: absolute; left: 0; right: 0; text-align: center;
    color: #fff; font-weight: 800; font-size: var(--river-text); line-height: 1;
  }
  .pool .riv.a { top: 10%; } .pool .riv.b { bottom: 10%; }
  .sq.water { background: transparent !important; z-index: 1; }

  /* 棋子：奶油牌，动物在下、汉字在上。无阴影。 */
  .piece {
    position: relative; width: var(--piece-w); height: var(--piece-h);
    border-radius: var(--piece-radius); background: var(--card); z-index: 2;
  }
  .piece .an {
    position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
    width: 92%; height: 78%;
    background-repeat: no-repeat; background-position: bottom center;
    background-size: contain;
  }
  .piece .nm {
    position: absolute; left: 0; right: 0; top: 4%;
    text-align: center; font-size: var(--label-size);
    font-weight: 700; line-height: 1; color: #1a1a1a;
  }
  /* 红方整张牌转 180 度，面朝对面玩家 —— 实体棋盘就是这样摆的 */
  .piece.foe { transform: rotate(180deg); }
</style>
</head>
<body>

<h1>棋盘预览 · 风格 A 素材 + 新版式</h1>
<p class="sub">
  <b>每改一轮，先在这一页和参考图并排看过再报。</b><br>
  版式：格 70×52、缝 4、圆角 8、外框 20 —— 整板 514×500，比值 <b>1.0280</b>，
  参考图实测 1.028。素材是生成的风格 A，已 alpha trim 并留 2% 安全边。
</p>

<div class="side">
  <div>
    <div class="cap">参考 · 实体棋盘</div>
    <img class="ref" src="_ref_local.jpg" alt="参考棋盘"
      onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'参考图不在本地（已 gitignore，属正常）',style:'color:#999;font-size:13px;padding:40px 0'}))">
  </div>
  <div>
    <div class="cap">重建 · 风格 A + 新版式</div>
    <div id="out"></div>
  </div>
</div>

<script>
(function () {
  const A = '../src/assets/art/';
  const NAME = { rat:'鼠', cat:'猫', dog:'犬', wolf:'狼', leopard:'豹', tiger:'虎', lion:'狮', elephant:'象' };
  const COLS = 7, ROWS = 9, idx = (c, r) => r * COLS + c;
  const isWater = (i) => [1,2,4,5].includes(i % COLS) && [3,4,5].includes(Math.floor(i / COLS));
  const isCroc = (i) => i === idx(1,4) || i === idx(5,4);
  const LILY = [idx(2,3), idx(4,3), idx(2,5), idx(4,5)];
  const TRAPS = [idx(2,0), idx(4,0), idx(3,1), idx(2,8), idx(4,8), idx(3,7)];
  const LAYOUT = [
    [0,0,'lion','foe'],[6,0,'tiger','foe'],[1,1,'dog','foe'],[5,1,'cat','foe'],
    [0,2,'rat','foe'],[2,2,'leopard','foe'],[4,2,'wolf','foe'],[6,2,'elephant','foe'],
    [0,6,'elephant','mine'],[2,6,'wolf','mine'],[4,6,'leopard','mine'],[6,6,'rat','mine'],
    [1,7,'cat','mine'],[5,7,'dog','mine'],[0,8,'tiger','mine'],[6,8,'lion','mine'],
  ];
  const el = (t, c) => { const n = document.createElement('div'); if (c) n.className = c; return n; };
  const css = (n, p) => getComputedStyle(document.documentElement).getPropertyValue(p);

  const frame = el('frame'); frame.className = 'frame';
  const board = el('board'); board.className = 'board';
  const at = new Map(LAYOUT.map(([c, r, rank, side]) => [idx(c, r), { rank, side }]));

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = idx(c, r), sq = el('div', 'sq');
    let bg = '';
    if (isWater(i)) { sq.classList.add('water');
      if (isCroc(i)) sq.appendChild(terr(A + 'croc.png', 112, 112));
      else if (LILY.includes(i)) sq.appendChild(terr(A + 'lily.png', 54, 54));
    } else if (i === idx(3,8)) { bg = 'var(--den-bg)'; sq.appendChild(terr(A + 'den-mine.png', 62, 86)); }
    else if (i === idx(3,0)) { bg = 'var(--den-bg)'; sq.appendChild(terr(A + 'den-foe.png', 62, 86, true)); }
    // 绿方（下方）的陷阱转 180 度，夹口朝向自己这边
    else if (TRAPS.includes(i)) { bg = 'var(--trap-bg)'; sq.appendChild(terr(A + 'trap.png', 72, 72, r >= 6)); }
    else if (r <= 2) { bg = 'var(--grass-foe)'; sq.appendChild(deco(A + 'ground-foe.png')); }
    else if (r >= 6) { bg = 'var(--grass-mine)'; sq.appendChild(deco(A + 'ground-mine.png')); }
    else { bg = 'var(--earth)'; sq.appendChild(deco(A + 'ground-earth.png')); }
    if (bg) sq.style.background = bg;

    const p = at.get(i);
    if (p) {
      const card = el('div', 'piece' + (p.side === 'foe' ? ' foe' : ''));
      const an = el('div', 'an');
      an.style.backgroundImage = `url(${A}${p.rank}.png)`;
      const nm = el('div', 'nm'); nm.className = 'nm'; nm.textContent = NAME[p.rank];
      card.appendChild(an); card.appendChild(nm);
      sq.appendChild(card);
    }
    board.appendChild(sq);
  }

  function terr(url, wPct, hPct, flip) {
    const d = el('div', 'terr');
    d.style.width = wPct + '%'; d.style.height = hPct + '%';
    d.style.backgroundImage = `url(${url})`;
    if (flip) d.style.transform = 'translate(-50%,-50%) rotate(180deg)';
    return d;
  }
  function deco(url) {
    const d = el('div', 'deco');
    d.style.backgroundImage = `url(${url})`;
    return d;
  }

  // 两片池塘：列 1-2 和 4-5，行 3-5
  requestAnimationFrame(() => {
    const cw = parseFloat(getComputedStyle(board).gridTemplateColumns.split(' ')[0]);
    const ch = parseFloat(getComputedStyle(board).gridTemplateRows.split(' ')[0]);
    const gap = parseFloat(getComputedStyle(board).gap);
    for (const c0 of [1, 4]) {
      const pool = el('div', 'pool');
      pool.style.left = (c0 * (cw + gap)) + 'px';
      pool.style.top = (3 * (ch + gap)) + 'px';
      pool.style.width = (2 * cw + gap) + 'px';
      pool.style.height = (3 * ch + 2 * gap) + 'px';
      const w = el('div', 'wav'); w.style.backgroundImage = `url(${A}river.png)`;
      pool.appendChild(w);
      for (const [ch2, cls] of [['小','a'], ['河','b']]) {
        const t = el('div', 'riv ' + cls); t.textContent = ch2; pool.appendChild(t);
      }
      board.insertBefore(pool, board.firstChild);
    }
  });

  frame.appendChild(board);
  document.getElementById('out').appendChild(frame);
})();
</script>
</body>
</html>
