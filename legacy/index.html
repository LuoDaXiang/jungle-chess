<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>斗兽棋</title>
<style>
  /* Sizing is driven by one variable so the board fits a 1366x768 laptop and a
     1920x1080 desktop without a second layout. 88px is the comfortable size;
     52px is the floor below which a six-year-old starts mis-clicking. */
  :root {
    --cell: clamp(52px, min(8.6vh, 11.5vw), 88px);
    --gap: 3px;
    /* Sides are colour-coded end to end: the child's half of the board is
       green grass with green-bordered pieces, the computer's is red. The two
       rows flanking the river are earth, so the middle of the board reads as
       neutral ground rather than belonging to anyone.

       Pieces stay cream cards with a coloured border rather than solid green
       and red — a green piece on green grass loses its edges. This is what the
       physical set does too. */
    --grass-mine: #cfe4a0;
    --grass-mine-alt: #c3da91;
    --grass-foe: #f4aeae;
    --grass-foe-alt: #eea1a1;
    /* Brown rather than orange: "earth", and it keeps the river banks from
       looking like the same material as the golden traps. */
    --earth: #d3945c;
    --earth-alt: #c88a51;
    --water: #9ad4ef;
    --trap: #f2c25a;
    /* Pale tints, because the den squares carry a saturated house on top —
       matching the house colour to its own square made it disappear. */
    --den-mine: #a9dc8e;
    --den-foe: #f7c4c1;

    --mine: #3f8f36;
    --foe: #cf3a34;
    /* The computer's move trail. Dark enough to read on every square colour,
       kept in the red family so it still says "this was the opponent". */
    --trail: #8e1f1f;
    /* Gold means "your move right now": selection glow and legal targets. */
    --pick: #ffc21a;

    --red: #d5372f;
    --ink: #2b2b2b;
    --paper: #fdf8ee;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--paper); color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; align-items: center; }

  /* --- gate: browsers need a real click before any audio plays --- */
  #gate {
    position: fixed; inset: 0; z-index: 50;
    background: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px;
  }
  #gate h1 { font-size: 56px; margin: 0; letter-spacing: 8px; }
  #gate p { font-size: 20px; color: #6b6b6b; margin: 0; }
  .big-btn {
    font: inherit; font-size: 30px; font-weight: 700;
    padding: 20px 56px; border: none; border-radius: 999px;
    background: var(--red); color: #fff; cursor: pointer;
    box-shadow: 0 6px 0 #a92a24;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #a92a24; }

  /* --- top bar --- */
  #bar {
    width: 100%; max-width: 980px;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; flex-wrap: wrap;
  }
  #bar button {
    font: inherit; font-size: 17px; font-weight: 600;
    padding: 10px 18px; border: 2px solid var(--ink); border-radius: 12px;
    background: #fff; cursor: pointer;
  }
  #bar button:disabled { opacity: .35; cursor: default; }
  #bar button.on { background: var(--ink); color: #fff; }
  #title { font-size: 22px; font-weight: 800; margin-right: auto; }

  /* --- message line: short label only, the explanation is spoken --- */
  #msg {
    min-height: 34px; font-size: 22px; font-weight: 700;
    padding: 2px 12px; text-align: center;
  }

  /* --- board --- */
  #board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(7, var(--cell));
    grid-template-rows: repeat(9, var(--cell));
    gap: var(--gap);
    padding: var(--gap);
    background: #b98d5f; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .sq {
    position: relative; border-radius: 6px;
    background: var(--grass-mine);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .sq.z-mine     { background: var(--grass-mine); }
  .sq.z-mine.alt { background: var(--grass-mine-alt); }
  .sq.z-foe      { background: var(--grass-foe); }
  .sq.z-foe.alt  { background: var(--grass-foe-alt); }
  .sq.z-earth     { background: var(--earth); }
  .sq.z-earth.alt { background: var(--earth-alt); }
  .sq.water { background: var(--water); }
  .sq.trap  { background: var(--trap); }
  .sq.den.den-mine { background: var(--den-mine); }
  .sq.den.den-foe  { background: var(--den-foe); }
  /* The den is the win condition on both sides, so it gets an edge that says
     "this square is not ordinary ground". */
  .sq.den { box-shadow: inset 0 0 0 3px rgba(0,0,0,.18); }
  /* Terrain art sits under the pieces and is drawn once, not on every render. */
  .terrain, .layer { position: absolute; inset: 0; }
  .terrain { pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .terrain svg { width: 74%; height: 74%; }
  .sq.water .terrain svg { width: 88%; height: 88%; }
  .terrain.lily svg { width: 58%; height: 58%; opacity: .38; }
  .layer { display: flex; align-items: center; justify-content: center; }

  /* Pieces copy the physical set: pale card, animal head, name in the corner. */
  .piece {
    position: relative;
    width: 90%; height: 90%; border-radius: 22%;
    background: #fdf2d0;
    border: 4px solid var(--mine);
    box-shadow: 0 3px 6px rgba(0,0,0,.28);
    transition: transform .12s;
    overflow: hidden;
  }
  /* .mine / .foe are emitted alongside the engine's own side names, so the
     stylesheet never has to remember that engine-"red" is the green player. */
  .piece.foe { border-color: var(--foe); }
  .piece svg { position: absolute; inset: 6%; width: 88%; height: 88%; }
  .piece .nm {
    position: absolute; right: 4%; bottom: 1%;
    font-size: calc(var(--cell) * .27); font-weight: 800; line-height: 1;
    color: var(--mine); text-shadow: 0 1px 0 #fff, 0 0 3px #fff;
  }
  .piece.foe .nm { color: var(--foe); }
  .piece.sel { transform: scale(1.09); box-shadow: 0 0 0 5px var(--pick), 0 3px 8px rgba(0,0,0,.35); }
  .piece.weak { opacity: .5; }

  /* Legal destinations: a fat dot for an empty square, a ring for a capture. */
  /* Gold, not green or red: a destination marker has to read on grass of both
     colours, on earth and on water, and it belongs to the player's turn rather
     than to either side's territory. The dark edge carries it over light gold
     backgrounds like the traps. */
  .dot {
    position: absolute; width: 32%; height: 32%; border-radius: 50%;
    background: var(--pick);
    box-shadow: 0 0 0 3px rgba(60,35,0,.55);
    pointer-events: none;
  }
  .ring {
    position: absolute; inset: 3%; border-radius: 50%;
    border: 5px solid var(--pick);
    box-shadow: 0 0 0 2px rgba(60,35,0,.5), inset 0 0 0 2px rgba(60,35,0,.5);
    pointer-events: none;
  }
  /* --- move trail: what the computer just did --- */
  /* Drawn in the opponent's blue so it never reads as your own selection,
     and kept on screen until you move, because a six-year-old may be looking
     somewhere else when the reply lands. */
  #trail {
    position: absolute; inset: 0;
    /* An <svg> without explicit sizing falls back to 300x150, which is smaller
       than the board; the arrow then only survives because of overflow. Pin it
       to the board so long leaps (a lion jumping the river) draw correctly. */
    width: 100%; height: 100%;
    pointer-events: none; z-index: 6;
    overflow: visible;
  }
  .from-mark {
    position: absolute; inset: 18%;
    border: 3px dashed var(--trail); border-radius: 50%;
    opacity: .55; pointer-events: none;
  }
  .from-mark::after {
    content: ""; position: absolute; inset: 26%;
    border-radius: 50%; background: var(--trail); opacity: .35;
  }
  .to-mark {
    position: absolute; inset: 1%;
    border: 4px dashed var(--trail); border-radius: 20%;
    pointer-events: none;
    animation: land .45s ease-out;
  }
  @keyframes land {
    0% { transform: scale(1.35); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  /* The piece the computer took. A translucent overlay on the capturing piece
     was invisible in practice — it just made the winner look slightly darker.
     A badge on the corner reads as "this one died here" at a glance. */
  .eaten {
    position: absolute; top: -5%; left: -5%;
    width: 48%; height: 48%;
    border-radius: 50%;
    background: rgba(255,255,255,.94);
    box-shadow: 0 1px 5px rgba(0,0,0,.4);
    /* Partly desaturated, not fully: the child should still recognise WHICH
       animal was taken, while it still reads as "no longer on the board". */
    filter: grayscale(.45);
    pointer-events: none; z-index: 9;
  }
  .eaten svg { width: 100%; height: 100%; opacity: .8; }
  .eaten .x {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell) * .3); color: #c22; font-weight: 900;
  }
  /* On a mutual kill both squares end up empty, so the badge can take the
     whole square instead of hiding in a corner. */
  .eaten.solo {
    top: 12%; left: 12%; width: 76%; height: 76%;
  }
  .eaten.solo .x { font-size: calc(var(--cell) * .46); }
  .sliding { position: relative; z-index: 8; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-7px); } 40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
  }
  .shake { animation: shake .38s; }

  #overlay {
    position: fixed; inset: 0; z-index: 40;
    background: var(--paper);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; text-align: center; padding: 20px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 40px; margin: 0; }
  #overlay p { font-size: 20px; margin: 0; color: #555; max-width: 620px; line-height: 1.6; }
  .menu-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .lesson-btn {
    font: inherit; font-size: 19px; font-weight: 700;
    padding: 16px 22px; border-radius: 14px; border: 3px solid var(--ink);
    background: #fff; cursor: pointer; min-width: 190px;
  }
  /* Carry the board's colour language into the menu: learning is on your own
     green side, a game is played against the red one. Without this every
     button looks the same and the child has to read to tell them apart. */
  .lesson-btn.learn { border-color: var(--mine); color: #2c6a26; }
  .lesson-btn.learn .b { color: var(--mine); opacity: .9; }
  .lesson-btn.play  { border-color: var(--foe); color: #9e2621; }
  .lesson-btn.play .b { color: var(--foe); opacity: .9; }
  .lesson-btn.done { background: #dff0cc; }
  .lesson-btn .b { font-size: 15px; opacity: .6; display: block; }
</style>
</head>
<body>

<div id="gate">
  <h1>斗兽棋</h1>
  <p>点下面的按钮，就可以开始了</p>
  <button class="big-btn" id="gateBtn">开 始</button>
</div>

<div id="bar">
  <span id="title">斗兽棋</span>
  <button id="btnMenu">主菜单</button>
  <button id="btnUndo">悔棋 <span id="undoLeft">3</span></button>
  <button id="btnRepeat">再说一遍</button>
  <button id="btnReplay">刚才走的</button>
  <button id="btnMute">🔊 声音</button>
</div>

<div id="msg"></div>
<div id="board"><svg id="trail" aria-hidden="true"></svg></div>

<div id="overlay">
  <h2 id="ovTitle"></h2>
  <p id="ovText"></p>
  <div class="menu-row" id="ovButtons"></div>
</div>

<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="lessons.js"></script>
<script src="sprites.js"></script>
<script src="speech.js"></script>
<script>
(function () {
  'use strict';
  var J = window.Jungle, AI = window.JungleAI;
  var LESSONS = window.Lessons.LESSONS, VOICE = window.Lessons.VOICE;

  var UNDO_PER_GAME = 3;         // enough to fix a misclick, not enough to brute-force
  var AI_THINK_DELAY = 550;      // ms; a move that lands instantly reads as a glitch
  var MAX_LEVEL = AI.MAX_LEVEL;
  var LEVEL_NAME = { 1: '最简单', 2: '有点难', 3: '很难', 4: '非常难', 5: '最厉害' };

  function levelButton(L) {
    return {
      label: '下一盘棋',
      sub: '难度 ' + L + ' · ' + LEVEL_NAME[L],
      kind: 'play',
      fn: function () { startGame(L); }
    };
  }
  var LONG_GAME_MS = 15 * 60000; // gentle break reminder

  var boardEl = document.getElementById('board');
  var msgEl = document.getElementById('msg');
  var titleEl = document.getElementById('title');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovButtons = document.getElementById('ovButtons');
  var undoLeftEl = document.getElementById('undoLeft');

  var S = {
    mode: 'menu',        // 'menu' | 'lesson' | 'play'
    game: null,
    selected: -1,
    lessonIdx: 0,
    stepIdx: 0,
    inspected: {},
    lastSpoken: null,
    aiLevel: 1,
    lossStreak: 0,
    winStreak: 0,
    undoLeft: UNDO_PER_GAME,
    snapshots: [],
    recent: null,          // recent position keys, so the AI avoids shuffling
    lastMove: null,        // the computer's last move, drawn until you reply
    busy: false,
    startedAt: 0,
    remindedLong: false,
    done: {}
  };

  try {
    var saved = JSON.parse(localStorage.getItem('jungle.progress') || '{}');
    S.done = saved.done || {};
    S.aiLevel = saved.aiLevel || 1;
  } catch (e) { /* private mode or blocked storage: start fresh */ }

  function save() {
    try {
      localStorage.setItem('jungle.progress',
        JSON.stringify({ done: S.done, aiLevel: S.aiLevel }));
    } catch (e) {}
  }

  function say(line, onEnd) {
    if (!line) { if (onEnd) onEnd(); return; }
    S.lastSpoken = line;
    window.Speech.speak(line.key, line.text, onEnd);
  }
  function setMsg(t) { msgEl.textContent = t || ''; }

  // ---------- board rendering ----------
  var cells = [];
  var layers = [];
  var SP = window.Sprites;
  // Decorative lily pads, mirrored across the board like the printed set.
  var LILY = [J.idx(2, 3), J.idx(2, 5), J.idx(4, 3), J.idx(4, 5)];
  (function buildBoard() {
    for (var r = 0; r < J.ROWS; r++) {
      for (var c = 0; c < J.COLS; c++) {
        var i = J.idx(c, r);
        var d = document.createElement('div');
        d.className = 'sq';
        var art = '';
        if (J.isWater(i)) {
          d.classList.add('water');
          if (J.isCroc(i)) art = SP.croc;
          else if (LILY.indexOf(i) >= 0) art = SP.lily;
        } else if (i === J.DEN.red || i === J.DEN.black) {
          // The player is engine-side 'red' and sits at the bottom.
          var isMine = (i === J.DEN.red);
          d.classList.add('den', isMine ? 'den-mine' : 'den-foe');
          art = isMine ? SP.denMine : SP.denFoe;
        } else if (J.isTrapOf(i, 'red') || J.isTrapOf(i, 'black')) {
          d.classList.add('trap');
          art = SP.trap;
        } else {
          // Three bands: the computer's home rows, the earth flanking the
          // river, and the player's home rows.
          d.classList.add(r <= 2 ? 'z-foe' : (r >= 6 ? 'z-mine' : 'z-earth'));
          if ((c + r) % 2) d.classList.add('alt');
        }

        var terrain = document.createElement('div');
        terrain.className = 'terrain' + (art === SP.lily ? ' lily' : '');
        terrain.innerHTML = art;
        d.appendChild(terrain);

        var layer = document.createElement('div');
        layer.className = 'layer';
        d.appendChild(layer);

        d.dataset.i = i;
        d.addEventListener('click', onCellClick);
        boardEl.appendChild(d);
        cells[i] = d;
        layers[i] = layer;
      }
    }
  })();

  function render() {
    var g = S.game;
    var moves = S.selected >= 0 ? J.legalMovesFrom(g, S.selected) : [];
    for (var i = 0; i < cells.length; i++) {
      var el = layers[i];
      el.innerHTML = '';
      var p = g && g.board[i];
      if (p) {
        var d = document.createElement('div');
        // Keep the engine's own side name AND a plain mine/foe label, so the
        // stylesheet never has to encode that engine-"red" is the green player.
        d.className = 'piece ' + p.side + ' ' + (p.side === 'red' ? 'mine' : 'foe');
        // A trapped piece is drawn faded: the rule is invisible otherwise.
        if (J.isTrapOf(i, J.opponent(p.side))) d.classList.add('weak');
        if (i === S.selected) d.classList.add('sel');
        d.innerHTML = SP[J.KEY_BY_RANK[p.rank]] +
          '<span class="nm">' + J.NAME_CN[p.rank] + '</span>';
        el.appendChild(d);
      }
      if (moves.indexOf(i) >= 0) {
        var m = document.createElement('div');
        m.className = g.board[i] ? 'ring' : 'dot';
        el.appendChild(m);
      }
    }
    drawMoveMarks();
    drawTrail();
    undoLeftEl.textContent = S.undoLeft;
    document.getElementById('btnReplay').disabled = !S.lastMove;
    document.getElementById('btnUndo').disabled =
      S.mode !== 'play' || S.undoLeft <= 0 || S.snapshots.length === 0;
  }

  // Geometry comes from the live DOM, so it survives the responsive --cell.
  function cellCenter(i) {
    var el = cells[i];
    return { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 };
  }

  function miniSprite(piece, solo) {
    return '<div class="eaten' + (solo ? ' solo' : '') + '">' +
           SP[J.KEY_BY_RANK[piece.rank]] + '<span class="x">✕</span></div>';
  }

  // Start dot, landing box, and the dead piece, painted on top of the squares.
  function drawMoveMarks() {
    var m = S.lastMove;
    if (!m) return;

    var fromLayer = layers[m.from];
    var toLayer = layers[m.to];

    if (m.mutual) {
      // Both pieces died: show each one where it fell, so "they are both gone"
      // is visible rather than something the child has to infer.
      fromLayer.insertAdjacentHTML('beforeend', miniSprite(m.mover, true));
      if (m.captured) toLayer.insertAdjacentHTML('beforeend', miniSprite(m.captured, true));
    } else {
      fromLayer.insertAdjacentHTML('beforeend', '<div class="from-mark"></div>');
      if (m.captured) toLayer.insertAdjacentHTML('beforeend', miniSprite(m.captured));
    }
    toLayer.insertAdjacentHTML('beforeend', '<div class="to-mark"></div>');
  }

  // Dashed arrow from where it started to where it ended.
  function drawTrail() {
    var svg = document.getElementById('trail');
    svg.innerHTML = '';
    var m = S.lastMove;
    if (!m) return;

    var a = cellCenter(m.from), b = cellCenter(m.to);
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    // Pull both ends in so the line does not hide under the two markers.
    var pad = cells[m.to].offsetWidth * 0.34;
    var x1 = a.x + (dx / len) * pad, y1 = a.y + (dy / len) * pad;
    var x2 = b.x - (dx / len) * pad, y2 = b.y - (dy / len) * pad;

    svg.innerHTML =
      '<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="5.5" refY="3" ' +
      'orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8e1f1f"/></marker></defs>' +
      '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" ' +
      'stroke="#8e1f1f" stroke-width="4" stroke-linecap="round" ' +
      'stroke-dasharray="9 7" opacity=".75" marker-end="url(#ah)"/>';
  }

  /*
   * Slide the piece in from where it came. The board is redrawn from scratch
   * every move, so the piece is already sitting on its destination — start it
   * offset by the distance travelled and let it settle. Two nested rAFs so the
   * offset is painted once before the transition begins.
   */
  function slidePiece(from, to) {
    var el = layers[to].querySelector('.piece');
    if (!el) return;
    var a = cellCenter(from), b = cellCenter(to);
    el.classList.add('sliding');
    el.style.transition = 'none';
    el.style.transform = 'translate(' + (a.x - b.x) + 'px,' + (a.y - b.y) + 'px)';
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        el.style.transition = 'transform 340ms cubic-bezier(.2,.7,.3,1)';
        el.style.transform = '';
        setTimeout(function () {
          el.classList.remove('sliding');
          el.style.transition = '';
          el.style.transform = '';
        }, 380);
      });
    });
  }

  function clearTrail() {
    S.lastMove = null;
    var svg = document.getElementById('trail');
    if (svg) svg.innerHTML = '';
  }

  function shake(i) {
    var el = cells[i];
    el.classList.remove('shake');
    void el.offsetWidth; // restart the animation
    el.classList.add('shake');
  }

  function snapshot() {
    S.snapshots.push({ board: S.game.board.slice(), turn: S.game.turn });
    if (S.snapshots.length > 40) S.snapshots.shift();
  }

  // Remember the last few positions. Two engines with nothing to gain will
  // otherwise walk the same piece back and forth until the game times out;
  // a small penalty on repeats is enough to make one of them try something.
  function rememberPosition() {
    if (!S.recent) S.recent = [];
    S.recent.push(AI.positionKey(S.game.board, S.game.turn));
    if (S.recent.length > 8) S.recent.shift();
  }

  // ---------- click handling ----------
  function onCellClick(ev) {
    if (S.busy || !S.game || S.game.winner) return;
    var i = parseInt(ev.currentTarget.dataset.i, 10);
    var g = S.game;
    var p = g.board[i];

    if (S.mode === 'lesson' && currentStep().goal.type === 'inspect') {
      if (p && p.side === 'red') {
        var lines = currentStep().pieceLines || {};
        var line = lines[J.KEY_BY_RANK[p.rank]];
        S.inspected[p.rank] = true;
        S.selected = i; render();
        say(line);
        var seen = Object.keys(S.inspected).length;
        setMsg('已经认识 ' + seen + ' / 8');
        if (seen >= 8) setTimeout(stepSucceeded, 900);
      }
      return;
    }

    // Selecting one of your own pieces.
    if (p && p.side === 'red') {
      S.selected = (S.selected === i) ? -1 : i;
      render();
      return;
    }

    if (S.selected < 0) return;

    var legal = J.legalMovesFrom(g, S.selected);
    if (legal.indexOf(i) < 0) {
      shake(i);
      var hint = lessonHintFor(i);
      if (hint) say(hint);
      else if (p) say(VOICE.cannotEat);
      else say(VOICE.illegal);
      return;
    }

    doPlayerMove(S.selected, i);
  }

  function lessonHintFor(i) {
    if (S.mode !== 'lesson') return null;
    var hints = currentStep().hints || [];
    for (var k = 0; k < hints.length; k++) {
      if (J.idx(hints[k].at[0], hints[k].at[1]) === i) return hints[k];
    }
    return null;
  }

  function doPlayerMove(from, to) {
    // Your move answers the computer's, so its trail has done its job.
    clearTrail();
    var captured = !!S.game.board[to];
    // Read this before the move: applyMove clears both squares on a collision.
    var mutual = captured ? J.isMutualKill(S.game, from, to) : false;
    snapshot();
    J.applyMove(S.game, from, to);
    rememberPosition();
    S.selected = -1;
    render();

    if (S.mode === 'lesson') { checkLessonGoal(from, to, captured); return; }

    if (S.game.winner) { endGame(); return; }
    if (mutual) say(VOICE.mutual);
    else if (captured) say(VOICE.captured);
    aiTurn();
  }

  // ---------- AI turn ----------
  function aiTurn() {
    S.busy = true;
    // Tiers 4-5 genuinely think for seconds and block the page while they do.
    // Say so, otherwise the freeze reads as a crash to a six-year-old.
    setMsg(S.aiLevel >= 4 ? '电脑在认真想…要等一下' : '电脑在想…');
    // A minimum of one frame so the message paints before the search blocks.
    var delay = S.aiLevel >= 4 ? 30 : AI_THINK_DELAY;
    setTimeout(function () {
      var mv = AI.chooseMove(S.game, S.aiLevel, { avoid: S.recent });
      if (!mv) { S.game.winner = 'red'; S.busy = false; endGame(); return; }
      var tookOurs = !!S.game.board[mv.to];
      var aiMutual = tookOurs ? J.isMutualKill(S.game, mv.from, mv.to) : false;
      // Capture the identities BEFORE the move: applyMove clears both squares
      // on a collision, and we still want to show what died where.
      var moverPiece = S.game.board[mv.from];
      var victimPiece = S.game.board[mv.to];
      J.applyMove(S.game, mv.from, mv.to);
      S.lastMove = {
        from: mv.from, to: mv.to, mutual: aiMutual,
        mover: { rank: moverPiece.rank, side: moverPiece.side },
        captured: victimPiece ? { rank: victimPiece.rank, side: victimPiece.side } : null
      };
      render();
      if (!aiMutual) slidePiece(mv.from, mv.to);
      S.busy = false;
      if (S.game.winner) { endGame(); return; }
      setMsg('该你走了');
      if (aiMutual) say(VOICE.mutual);
      else if (tookOurs) say(VOICE.lost);
      checkLongGame();
    }, delay);
  }

  function checkLongGame() {
    if (S.remindedLong || !S.startedAt) return;
    if (Date.now() - S.startedAt > LONG_GAME_MS) {
      S.remindedLong = true;
      say(VOICE.longGame);
    }
  }

  // ---------- lessons ----------
  function currentLesson() { return LESSONS[S.lessonIdx]; }
  function currentStep() { return currentLesson().steps[S.stepIdx]; }

  function startLesson(idx) {
    S.mode = 'lesson';
    S.lessonIdx = idx;
    S.stepIdx = 0;
    loadStep();
  }

  function loadStep() {
    var st = currentStep();
    S.busy = false;
    clearTrail();
    S.inspected = {};
    S.selected = -1;
    S.undoLeft = UNDO_PER_GAME;
    S.snapshots = [];

    if (st.goal.type === 'play') { startGame(1); return; }

    S.game = st.setup
      ? J.makePosition(st.setup, st.turn || 'red')
      : J.createGame();
    titleEl.textContent = currentLesson().badge + '、' + currentLesson().title;
    setMsg('');
    render();
    say(st.say);
    hideOverlay();
  }

  function checkLessonGoal(from, to, captured) {
    var st = currentStep();
    var g = st.goal;
    var ok = false;

    if (g.type === 'capture') ok = captured && to === J.idx(g.target[0], g.target[1]);
    else if (g.type === 'move') ok = to === J.idx(g.to[0], g.to[1]);
    else if (g.type === 'den') ok = S.game.winner === 'red';
    else if (g.type === 'safeMove') {
      var bad = g.forbidden.some(function (f) { return J.idx(f[0], f[1]) === to; });
      if (bad) {
        // Legal but exactly the mistake this step is about (walking into the
        // enemy trap). Shaking is wrong here: the move IS legal. Explain it,
        // then rewind so the child gets to make the right one.
        var h = null;
        (st.hints || []).forEach(function (x) {
          if (J.idx(x.at[0], x.at[1]) === to) h = x;
        });
        rewindLessonMove();
        say(h || VOICE.illegal);
        setMsg('我们退回去，再走一次');
        return;
      }
      ok = true;
    }

    if (ok) { stepSucceeded(); return; }

    // Wrong but harmless: let the child keep trying, no penalty, no modal.
    // A lesson has no opponent, so the turn must come straight back — applyMove
    // handed it to black, and the next click would throw "not red's turn" and
    // freeze the lesson. This also lets a step need several moves in a row
    // (lesson 6: into the trap first, then on into the den).
    S.game.winner = null;
    S.game.turn = 'red';
    setMsg('再试试');
  }

  // Undo the move just played inside a lesson, back to the child's turn.
  function rewindLessonMove() {
    var snap = S.snapshots.pop();
    if (!snap) return;
    S.game.board = snap.board.slice();
    S.game.turn = 'red';
    S.game.winner = null;
    S.selected = -1;
    render();
  }

  function stepSucceeded() {
    var st = currentStep();
    S.busy = true;
    say(st.success, function () {
      S.busy = false;
      if (S.stepIdx + 1 < currentLesson().steps.length) {
        S.stepIdx++;
        loadStep();
      } else {
        S.done[currentLesson().id] = true;
        save();
        showLessonDone();
      }
    });
    setMsg('做对了！');
  }

  function showLessonDone() {
    var next = S.lessonIdx + 1;
    var btns = [];
    if (next < LESSONS.length) {
      btns.push({ label: '下一关：' + LESSONS[next].title, fn: function () { startLesson(next); } });
    }
    btns.push({ label: '再练一次', fn: function () { startLesson(S.lessonIdx); } });
    btns.push({ label: '回主菜单', fn: showMenu });
    showOverlay('这一关通过了！', currentLesson().title, btns);
  }

  // ---------- free play ----------
  function startGame(level) {
    S.mode = 'play';
    S.busy = false;
    S.aiLevel = level || S.aiLevel;
    S.game = J.createGame();
    S.selected = -1;
    S.undoLeft = UNDO_PER_GAME;
    S.snapshots = [];
    S.recent = [];
    clearTrail();
    S.startedAt = Date.now();
    S.remindedLong = false;
    titleEl.textContent = '陪你下棋（难度 ' + S.aiLevel + ' · ' + LEVEL_NAME[S.aiLevel] + '）';
    setMsg('该你走了');
    hideOverlay();
    render();
    save();
  }

  function endGame() {
    render();
    var draw = S.game.winner === 'draw';
    var youWon = S.game.winner === 'red';
    // A draw counts for neither streak: nobody proved the level was wrong.
    if (!draw) {
      if (youWon) { S.winStreak++; S.lossStreak = 0; }
      else { S.lossStreak++; S.winStreak = 0; }
    }

    var extra = '';
    if (draw) {
      say(VOICE.draw);
    } else if (!youWon && S.lossStreak >= 2 && S.aiLevel > 1) {
      S.aiLevel--; S.lossStreak = 0; extra = '我们换简单一点的难度';
      say(VOICE.easier);
    } else if (youWon && S.winStreak >= 2 && S.aiLevel < MAX_LEVEL) {
      extra = '要不要试试更难的？';
      say(VOICE.harder);
    } else {
      say(youWon ? VOICE.win : VOICE.lose);
    }
    save();

    var btns = [{ label: '再来一盘', fn: function () { startGame(S.aiLevel); } }];
    if (youWon && !draw && S.aiLevel < MAX_LEVEL) {
      btns.push({ label: '换难一点', fn: function () { startGame(S.aiLevel + 1); } });
    }
    if (S.aiLevel > 1) {
      btns.push({ label: '换简单一点', fn: function () { startGame(S.aiLevel - 1); } });
    }
    btns.push({ label: '回主菜单', fn: showMenu });
    showOverlay(draw ? '平手！' : (youWon ? '你赢啦！' : '这局我赢了'), extra, btns);
  }

  // ---------- overlay / menu ----------
  function showOverlay(title, text, buttons) {
    ovTitle.textContent = title;
    ovText.textContent = text || '';
    ovButtons.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button');
      el.className = 'lesson-btn' + (b.kind ? ' ' + b.kind : '');
      el.innerHTML = b.label + (b.sub ? '<span class="b">' + b.sub + '</span>' : '');
      if (b.done) el.classList.add('done');
      el.addEventListener('click', function () { window.Speech.stop(); b.fn(); });
      ovButtons.appendChild(el);
    });
    overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  function showMenu() {
    S.mode = 'menu';
    S.selected = -1;
    S.busy = false;
    titleEl.textContent = '斗兽棋';
    setMsg('');
    var btns = LESSONS.map(function (L, k) {
      return {
        label: L.badge + '、' + L.title,
        sub: S.done[L.id] ? '已通过' : '教学',
        kind: 'learn',
        done: !!S.done[L.id],
        fn: function () { startLesson(k); }
      };
    });
    for (var L = 1; L <= MAX_LEVEL; L++) {
      btns.push(levelButton(L));
    }
    showOverlay('想玩哪一个？', '先学会规则，再和电脑下棋', btns);
  }

  // ---------- top bar ----------
  document.getElementById('btnMenu').addEventListener('click', function () {
    window.Speech.stop(); showMenu();
  });

  document.getElementById('btnUndo').addEventListener('click', function () {
    if (S.mode !== 'play' || S.undoLeft <= 0 || !S.snapshots.length || S.busy) return;
    // One undo rewinds a full round: your move plus the reply.
    var snap = S.snapshots.pop();
    S.game.board = snap.board.slice();
    S.game.turn = 'red';
    S.game.winner = null;
    S.undoLeft--;
    S.selected = -1;
    clearTrail();
    say(VOICE.undo);
    setMsg('该你走了');
    render();
  });

  document.getElementById('btnRepeat').addEventListener('click', function () {
    if (S.lastSpoken) say(S.lastSpoken);
  });

  // Watch the computer's last move again. No time limit on looking at it, and
  // no penalty for asking — the child should never have to guess what moved.
  document.getElementById('btnReplay').addEventListener('click', function () {
    if (!S.lastMove || S.busy) return;
    render();
    if (!S.lastMove.mutual) slidePiece(S.lastMove.from, S.lastMove.to);
  });

  var muteBtn = document.getElementById('btnMute');
  muteBtn.addEventListener('click', function () {
    var m = window.Speech.setMuted(!window.Speech.isMuted());
    muteBtn.textContent = m ? '🔇 静音' : '🔊 声音';
    muteBtn.classList.toggle('on', m);
  });

  // ---------- gate ----------
  document.getElementById('gateBtn').addEventListener('click', function () {
    window.Speech.unlock();
    document.getElementById('gate').style.display = 'none';
    say(VOICE.welcome);
    showMenu();
  });

  S.game = J.createGame();
  render();
})();
</script>
</body>
</html>
