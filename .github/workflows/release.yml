# 打 tag 就出三个平台的安装包。
#
# 存在的理由：macOS 上编译不出 Windows 包。Tauri 链接的是系统 WebView
# （Windows 用 WebView2、macOS 用 WKWebView、Linux 用 WebKitGTK）和系统原生库，
# 官方不支持交叉编译。所以每个平台的包必须在那个平台上构建——这就是 matrix。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # 也允许手动触发，出包不必非要打 tag

permissions:
  contents: write           # tauri-action 要创建 release 并上传产物

jobs:
  build:
    strategy:
      fail-fast: false      # 一个平台挂了，另外两个的包照样要拿到
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            # universal 包要同时编 ARM 和 Intel 两个架构再合并
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown'
          - platform: ubuntu-22.04
            args: ''
            rust-targets: 'wasm32-unknown-unknown'
          - platform: windows-latest
            args: ''
            rust-targets: 'wasm32-unknown-unknown'

    runs-on: ${{ matrix.platform }}
    name: 构建 ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux 的 Tauri 依赖必须手装，另外两个平台自带。
      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libayatana-appindicator3-dev \
            build-essential \
            file

      - uses: jetli/wasm-pack-action@v0.4.0

      - run: npm ci

      # 界面靠这份 WASM 同步算合法落点，必须在 vite build 之前生成。
      - name: 构建 WASM 引擎
        run: npm run wasm:build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('nightly-{0}', github.run_number) }}
          releaseName: 斗兽棋 ${{ github.ref_type == 'tag' && github.ref_name || format('nightly-{0}', github.run_number) }}
          releaseBody: '给孩子装的话，下载对应系统的安装包。Windows 是 .msi，macOS 是 .dmg。'
          releaseDraft: true      # 先出草稿，你确认过再发布
          prerelease: false
          args: ${{ matrix.args }}
