[package]
name = "jungle-engine-wasm"
description = "把 jungle-engine 编译成 WASM 给前端同步调用。界面算合法落点走这里，不走 IPC。"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jungle-engine = { workspace = true }
serde = { workspace = true }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[lints.rust]
unsafe_code = "forbid"

# wasm-pack 自带的 binaryen 比 rustc 老：rustc 现在默认发 bulk-memory 指令，
# 而 wasm-opt 默认不认，校验会挂。显式开启这些特性。
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']

[package.metadata.wasm-pack.profile.dev]
wasm-opt = ['-O0', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
