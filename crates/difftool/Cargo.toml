[package]
name = "jungle-difftool"
description = "把 Rust 引擎的规则判定按统一格式吐出来，交给差分脚本和旧 JS 版逐字比对。"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# 单独成 crate，不塞进 engine：serde_json 会跟着 engine 一起进 WASM 包，
# 而前端根本用不到它。
[[bin]]
name = "difftool"
path = "src/main.rs"

[dependencies]
jungle-engine = { workspace = true }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
